<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Atlas One — The Next Generation Earth Intelligence Platform. Explore our planet in photorealistic 3D." />
    <meta name="theme-color" content="#0a0e17" />
    <meta name="color-scheme" content="dark" />

    <title>Atlas One — Earth Intelligence Platform</title>

    <!-- Preconnect to critical origins -->
    <link rel="preconnect" href="https://ion.cesium.com" crossorigin />
    <link rel="preconnect" href="https://assets.ion.cesium.com" crossorigin />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <style>
      /* Critical inline styles for instant dark background — prevents flash of white */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0a0e17;
        color: #e2e8f0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }
      #cesium-container {
        width: 100%;
        height: 100%;
        position: absolute;
        top: 0;
        left: 0;
      }
      /* Splash screen shown before JS loads */
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1.5rem;
      }
      #splash-screen .splash-title {
        font-size: 1.5rem;
        font-weight: 300;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: #94a3b8;
        opacity: 0;
        animation: fadeInSplash 1.5s ease forwards;
      }
      #splash-screen .splash-loader {
        width: 40px;
        height: 40px;
        border: 2px solid rgba(148, 163, 184, 0.15);
        border-top-color: #60a5fa;
        border-radius: 50%;
        animation: spinSplash 1s linear infinite;
        opacity: 0;
        animation: spinSplash 1s linear infinite, fadeInSplash 1.5s ease 0.5s forwards;
      }
      @keyframes fadeInSplash {
        to { opacity: 1; }
      }
      @keyframes spinSplash {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Splash screen: visible before JS hydration -->
    <div id="splash-screen" role="alert" aria-label="Loading Atlas One">
      <div class="splash-title">Atlas One</div>
      <div class="splash-loader" aria-hidden="true"></div>
    </div>

    <div id="app">
      <div id="cesium-container" role="application" aria-label="Interactive 3D Earth globe"></div>
      <div id="ui-overlay" aria-live="polite"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
